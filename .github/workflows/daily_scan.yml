name: Daily covered call scan

on:
  schedule:
    # 14:45 UTC = 香港時間 22:45，美股開盤(9:30am ET)後至少15分鐘
    # (夏令EDT時開盤=13:30 UTC，冬令EST時開盤=14:30 UTC；
    #  固定用14:45 UTC確保全年都在開盤之後才跑)
    - cron: "45 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python -m src.scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
