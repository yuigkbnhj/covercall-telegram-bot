name: Daily covered call scan

on:
  # GitHub's own `schedule:` trigger proved unreliable for this repo (never
  # self-fired even once). A Cloudflare Worker cron now calls
  # workflow_dispatch instead - see cloudflare/src/worker.js.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python -m src.scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
