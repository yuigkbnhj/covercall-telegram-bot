name: Poll Telegram commands

on:
  schedule:
    # Offset from :00/:05/:10... - round minutes are the most congested
    # slots across all of GitHub Actions (every other repo's round-number
    # cron fires then too), so scheduled runs on them get delayed or
    # skipped more often. Repo is public, so Actions minutes are
    # unlimited - 5-minute cadence is fine.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency:
      group: poll-commands
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python -m src.poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit data changes
        run: |
          git config user.name "cover-call-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ config/
          git diff --staged --quiet && exit 0
          git commit -m "Update positions/holdings from Telegram command"
          # main may have moved since checkout (another push/run landed in
          # between) - rebase onto it before pushing instead of failing.
          git fetch origin main
          git rebase origin/main
          git push
