name = "covercall-trigger"
main = "src/worker.js"
compatibility_date = "2026-08-01"
# fetch() needs a public URL for Telegram's webhook to reach - workers.dev
# subdomain is that URL (no custom domain needed for this volume).
workers_dev = true

# scheduled() still handles the one genuinely time-based job (daily scan).
# handle_command.yml is no longer on a cron - it's dispatched per-message by
# fetch() below, via a Telegram webhook, instead of being polled for.
# GitHub's own `schedule:` trigger proved unreliable for this repo (see
# .github/workflows/*.yml), so this Worker's cron is the source of truth.
[triggers]
crons = [
  # daily_scan.yml - weekdays, after US market open. Cloudflare's day-of-week
  # is 1-7=SUN-SAT (1=Sunday), NOT the 0/1=Mon convention GitHub Actions uses -
  # so Mon-Fri here is 2-6, not 1-5.
  "45 14 * * 2-6",
]

[vars]
GITHUB_REPO = "yuigkbnhj/covercall-telegram-bot"
