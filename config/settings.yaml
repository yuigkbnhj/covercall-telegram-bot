# Covered call 篩選門檻與roll規則
# 可隨時修改，不需要改程式碼

delta_min: 0.20
delta_max: 0.30

dte_min: 21
dte_max: 45

min_annualized_return: 0.08   # 8%，低於此不建議

min_otm_vs_hv_move: 0.5       # strike的OTM距離要 >= 近20日實現波動率隱含的到期前預期移動幅度 x 此倍數，
                               # 否則標記為warning提醒可能被穿過(不會被排除，見screener._breach_risk_note)
                               # 1.0太嚴：對應約delta<=0.16，跟delta_min 0.20沒有交集，導致每個候選都被標記

risk_free_rate: 0.04          # 用於Black-Scholes反推delta

roll_dte_threshold: 5         # 剩餘天數 <= 此值，提醒考慮roll
roll_profit_capture: 0.50     # 合約市價跌到當初賣出價的此比例以下，提醒考慮roll/回補
roll_defensive_delta_threshold: 0.45  # delta達到此值(接近ATM，時間價值高點)，提醒考慮防守性roll

top_n_per_ticker: 3           # 每檔股票最多列出幾個機會
